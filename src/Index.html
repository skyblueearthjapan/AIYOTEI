<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mycalendar</title>
<base target="_top">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #ecebe6;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1a1a1a;
  }
  body { min-height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }

  /* App container */
  #app-shell {
    width: 100%;
    min-height: 100vh;
    background: #fafaf7;
    margin: 0 auto;
    position: relative;
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  @media (min-width: 768px) {
    body { background: #ecebe6; padding: 24px 0; }
    #app-shell {
      max-width: 480px;
      min-height: calc(100vh - 48px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
      overflow: hidden;
    }
  }

  /* Splash */
  #splash {
    position: fixed; inset: 0;
    background: #fafaf7;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 280ms ease;
    color: #888; font-size: 14px; letter-spacing: 1.6px;
    font-weight: 600;
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(26,26,26,0.92); color: #fff;
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; max-width: 80%;
    opacity: 0; pointer-events: none; z-index: 10000;
    transition: opacity 220ms ease, transform 220ms ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Sync indicator */
  #syncStatus {
    position: fixed; right: 18px; top: 18px;
    background: rgba(26,26,26,0.85); color: #fff;
    padding: 6px 12px; border-radius: 999px;
    font-size: 11px; opacity: 0; pointer-events: none; z-index: 10000;
    transition: opacity 220ms ease;
  }
  #syncStatus.show { opacity: 1; }
  #syncStatus.error { background: rgba(192,57,43,0.95); }
  #syncStatus.success { background: rgba(45,106,79,0.92); }

  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } }
</style>
</head>
<body>
  <div id="splash">Mycalendar</div>
  <div id="app-shell"><div id="root"></div></div>
  <div id="toast"></div>
  <div id="syncStatus"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
  const ACCENT = '#c8941d';
  const APP_NAME = 'Mycalendar';

  const EVENT_COLORS = {
    work:     { bar: '#1a1a1a', tint: 'rgba(26,26,26,0.05)' },
    personal: { bar: '#c8941d', tint: 'rgba(200,148,29,0.10)' },
    health:   { bar: '#2d6a4f', tint: 'rgba(45,106,79,0.08)' },
    finance:  { bar: '#9a3f2f', tint: 'rgba(154,63,47,0.08)' },
    social:   { bar: '#5a6c8f', tint: 'rgba(90,108,143,0.10)' },
  };

  const COLOR_KEY_TO_KIND = {
    health: 'health', work: 'work', family: 'social',
    finance: 'finance', travel: 'personal', fun: 'personal',
    school: 'personal', other: 'personal',
  };
  const KIND_LABELS = {
    work: '仕事', personal: 'プライベート', health: '健康',
    finance: '家計', social: '交流',
  };
  const COLOR_KEY_OPTIONS = [
    { key: 'work',    label: '仕事',     color: '#1a1a1a' },
    { key: 'health',  label: '健康',     color: '#2d6a4f' },
    { key: 'family',  label: '家族・交流', color: '#5a6c8f' },
    { key: 'finance', label: '家計',     color: '#9a3f2f' },
    { key: 'travel',  label: '旅行',     color: '#0077b6' },
    { key: 'fun',     label: '趣味',     color: '#c8941d' },
    { key: 'school',  label: '学校',     color: '#7b3fb6' },
    { key: 'other',   label: 'その他',   color: '#888' },
  ];

  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function mapColorKeyToKind(k) { return COLOR_KEY_TO_KIND[k] || 'personal'; }
  function jpMonthLabel(y, m) { return `${y}年${m}月`; }
  function jpFullDate(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const dows = ['日','月','火','水','木','金','土'];
    return `${y}年${m}月${d}日（${dows[dt.getDay()]}）`;
  }
  // 1日のイベントを時刻順にソート（終日 → 早い時刻 → 遅い時刻）
  function sortEventsByTime(events) {
    return [...events].sort((a, b) => {
      const aTime = a.start_time || '';
      const bTime = b.start_time || '';
      if (!aTime && !bTime) return 0;
      if (!aTime) return -1;
      if (!bTime) return 1;
      return aTime.localeCompare(bTime);
    });
  }
  function sortEventsMap(eventsMap) {
    const out = {};
    for (const k in eventsMap) {
      out[k] = sortEventsByTime(eventsMap[k] || []);
    }
    return out;
  }
  function buildMonthGrid(year, month, todayK) {
    const first = new Date(year, month - 1, 1);
    const startDow = first.getDay();
    const start = new Date(year, month - 1, 1 - startDow);
    const days = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      days.push({
        key, day: d.getDate(), dow: d.getDay(),
        inMonth: d.getMonth() === month - 1,
        isToday: key === todayK,
      });
    }
    return days;
  }

  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('GAS環境ではありません'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))
        [method](...args);
    });
  }
  function showToast(msg, ms = 2400) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el.__timer);
    el.__timer = setTimeout(() => el.classList.remove('show'), ms);
  }
  function showSync(state, msg) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.classList.remove('error', 'success');
    if (state) el.classList.add(state);
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el.__timer);
    el.__timer = setTimeout(() => el.classList.remove('show'), state === 'error' ? 4000 : 1600);
  }

  const { useState, useEffect, useRef, useMemo, useCallback } = React;

  const navBtn = {
    all: 'unset', cursor: 'pointer',
    width: 30, height: 30, borderRadius: 999,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    background: 'rgba(0,0,0,0.04)',
  };

  function CalendarScreen({ year, month, evMap, holidays, rokuyo, onPrev, onNext, onSelectDate, selectedDate, todayK }) {
    const grid = useMemo(() => buildMonthGrid(year, month, todayK), [year, month, todayK]);
    const weeks = [];
    for (let i = 0; i < 6; i++) weeks.push(grid.slice(i*7, i*7+7));
    const dows = ['日','月','火','水','木','金','土'];

    return (
      <div style={{ padding: '0 10px 18px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 6px 12px' }}>
          <button onClick={onPrev} aria-label="前の月" style={navBtn}>
            <svg width="9" height="14" viewBox="0 0 9 14"><path d="M7 1L1 7l6 6" stroke="#1a1a1a" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <div style={{ fontSize: 17, fontWeight: 500, color: '#1a1a1a', fontVariantNumeric: 'tabular-nums', letterSpacing: -0.3 }}>{jpMonthLabel(year, month)}</div>
          <button onClick={onNext} aria-label="次の月" style={navBtn}>
            <svg width="9" height="14" viewBox="0 0 9 14"><path d="M2 1l6 6-6 6" stroke="#1a1a1a" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', padding: '0 2px 6px' }}>
          {dows.map((d, i) => (
            <div key={d} style={{
              textAlign: 'center', fontSize: 10.5, fontWeight: 600, letterSpacing: 1.2,
              color: i === 0 ? '#c0392b' : i === 6 ? '#5a6c8f' : '#888',
            }}>{d}</div>
          ))}
        </div>
        <div style={{
          display: 'grid', gridTemplateRows: 'repeat(6, 1fr)',
          background: '#fff', borderRadius: 14, overflow: 'hidden',
          border: '0.5px solid rgba(0,0,0,0.05)',
        }}>
          {weeks.map((week, wi) => (
            <div key={wi} style={{
              display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)',
              borderBottom: wi < 5 ? '0.5px solid rgba(0,0,0,0.05)' : 'none',
              minHeight: 76,
            }}>
              {week.map((cell, ci) => {
                const evs = evMap[cell.key] || [];
                const visible = evs.slice(0, 2);
                const more = evs.length - visible.length;
                const isHoliday = !!(holidays && holidays[cell.key]);
                const dayColor = !cell.inMonth ? '#ccc'
                  : isHoliday ? '#c0392b'
                  : cell.dow === 0 ? '#c0392b'
                  : cell.dow === 6 ? '#5a6c8f' : '#1a1a1a';
                const isSelected = cell.key === selectedDate;
                const bg = isSelected ? 'rgba(0,0,0,0.04)'
                  : !cell.inMonth ? 'rgba(0,0,0,0.012)'
                  : isHoliday ? '#fff5f5'
                  : 'transparent';
                return (
                  <button key={ci} onClick={() => onSelectDate(cell.key)} style={{
                    all: 'unset', cursor: 'pointer', boxSizing: 'border-box',
                    padding: '6px 6px 4px', position: 'relative',
                    borderRight: ci < 6 ? '0.5px solid rgba(0,0,0,0.05)' : 'none',
                    background: bg,
                    transition: 'background 120ms ease',
                    overflow: 'hidden',
                  }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      {cell.isToday ? (
                        <div style={{
                          width: 22, height: 22, borderRadius: 999,
                          background: '#1a1a1a', color: '#fff',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                        }}>{cell.day}</div>
                      ) : (
                        <div style={{
                          fontSize: 12.5, fontWeight: cell.inMonth ? 500 : 400,
                          color: dayColor, fontVariantNumeric: 'tabular-nums',
                          padding: '2px 4px',
                        }}>{cell.day}</div>
                      )}
                      {rokuyo && rokuyo[cell.key] && cell.inMonth && (
                        <div style={{ fontSize: 8, color: '#bbb', letterSpacing: 0.2 }}>{rokuyo[cell.key]}</div>
                      )}
                    </div>
                    <div style={{ marginTop: 2, display: 'flex', flexDirection: 'column', gap: 2 }}>
                      {visible.map((ev, k) => {
                        const kind = mapColorKeyToKind(ev.color_key);
                        const c = EVENT_COLORS[kind];
                        return (
                          <div key={ev.event_id || k} style={{
                            fontSize: 9.5, lineHeight: '12px',
                            padding: '2px 4px', borderRadius: 3,
                            background: c.tint, color: c.bar,
                            fontWeight: 500,
                            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                            borderLeft: `2px solid ${c.bar}`,
                          }}>{ev.title}</div>
                        );
                      })}
                      {more > 0 && (
                        <div style={{ fontSize: 9, color: '#888', paddingLeft: 4 }}>+{more}件</div>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );
  }

  function DayDetailPanel({ dateKey, events, holidays, onEditEvent, onCreateEvent }) {
    const evs = events || [];
    const holiday = holidays && holidays[dateKey];

    return (
      <div style={{ padding: '6px 18px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', padding: '14px 0 10px', gap: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.4, color: '#888' }}>
            🍀 {jpFullDate(dateKey)}{holiday ? `・${holiday}` : ''}
          </div>
          <div style={{ flex: 1, height: 1, background: 'rgba(0,0,0,0.07)', alignSelf: 'center' }}></div>
          <div style={{ fontSize: 13.5, fontWeight: 500, color: ACCENT, fontVariantNumeric: 'tabular-nums' }}>{evs.length}件</div>
        </div>
        {evs.length === 0 ? (
          <div style={{
            background: '#fff', borderRadius: 14, padding: '22px 18px',
            textAlign: 'center', color: '#aaa', fontSize: 13,
            border: '0.5px solid rgba(0,0,0,0.05)',
          }}>予定はありません。下のボタンから追加できます。</div>
        ) : (
          <div style={{ background: '#fff', borderRadius: 14, overflow: 'hidden', border: '0.5px solid rgba(0,0,0,0.05)' }}>
            {evs.map((ev, i) => {
              const kind = mapColorKeyToKind(ev.color_key);
              const c = EVENT_COLORS[kind];
              return (
                <button key={ev.event_id || i} onClick={() => onEditEvent(ev.event_id)} style={{
                  all: 'unset', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12,
                  padding: '13px 16px', width: '100%', boxSizing: 'border-box',
                  borderBottom: i < evs.length - 1 ? '0.5px solid rgba(0,0,0,0.06)' : 'none',
                }}>
                  <div style={{ width: 4, alignSelf: 'stretch', borderRadius: 2, background: c.bar }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{
                      fontSize: 14.5, fontWeight: 500, color: '#1a1a1a',
                      whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                    }}>{ev.title}</div>
                    <div style={{ fontSize: 11.5, color: '#888', marginTop: 2, display: 'flex', gap: 8, alignItems: 'center' }}>
                      {ev.start_time && <span style={{ fontVariantNumeric: 'tabular-nums' }}>{ev.start_time}</span>}
                      {ev.start_time && <span style={{ width: 2, height: 2, borderRadius: 1, background: 'rgba(0,0,0,0.2)' }} />}
                      <span style={{
                        fontSize: 10.5, padding: '1px 7px', borderRadius: 999,
                        background: c.tint, color: c.bar, fontWeight: 600, letterSpacing: 0.4,
                      }}>{KIND_LABELS[kind]}</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
        <button onClick={() => onCreateEvent(dateKey)} style={{
          all: 'unset', cursor: 'pointer', display: 'block', boxSizing: 'border-box',
          width: '100%', textAlign: 'center', marginTop: 10,
          padding: '11px 0', fontSize: 13, fontWeight: 500,
          color: '#666', background: 'rgba(0,0,0,0.03)', borderRadius: 12,
        }}>＋ 予定を手動で追加</button>
      </div>
    );
  }

  function CalendarVoiceModal({ open, onClose, defaultDate, onAdded }) {
    const [listening, setListening] = useState(false);
    const [transcript, setTranscript] = useState('');
    const [parsed, setParsed] = useState(null);
    const [busy, setBusy] = useState(false);
    const recogRef = useRef(null);
    const supported = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);

    useEffect(() => {
      if (!open) {
        setListening(false); setTranscript(''); setParsed(null); setBusy(false);
        if (recogRef.current) try { recogRef.current.stop(); } catch (e) {}
      }
    }, [open]);

    const start = () => {
      setTranscript(''); setParsed(null);
      if (!supported) { showToast('音声認識非対応：テキストで入力してください'); return; }
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const r = new Rec();
      r.lang = 'ja-JP'; r.interimResults = true; r.continuous = true;
      let finalText = '';
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        setTranscript((finalText + interim).trim());
      };
      r.onerror = () => setListening(false);
      r.onend = () => setListening(false);
      recogRef.current = r;
      r.start();
      setListening(true);
    };

    const stop = async () => {
      if (recogRef.current) try { recogRef.current.stop(); } catch (e) {}
      setListening(false);
    };

    const runParse = async () => {
      const text = transcript.trim();
      if (!text) { showToast('テキストを入力してください'); return; }
      setBusy(true);
      try {
        const res = await rpc('previewCalendarParse', text);
        if (res && res.success) setParsed(res.eventData || res.data || res);
        else showToast(res && res.error ? res.error : 'AI解析に失敗');
      } catch (e) { showToast('AI解析エラー: ' + (e.message || e)); }
      finally { setBusy(false); }
    };

    const confirm = async () => {
      if (!parsed) return;
      setBusy(true);
      try {
        const payload = {
          title: parsed.title || '予定',
          start_date: parsed.start_date || defaultDate,
          end_date: parsed.end_date || parsed.start_date || defaultDate,
          start_time: parsed.start_time || null,
          end_time: parsed.end_time || null,
          all_day: !parsed.start_time,
          memo: parsed.memo || '',
          color_key: parsed.color_key || 'other',
        };
        const res = await rpc('registerEventDirect', payload, transcript);
        if (res && res.success) {
          showToast('予定を登録しました');
          onAdded && onAdded();
          onClose();
        } else showToast(res && res.error ? res.error : '登録に失敗');
      } catch (e) { showToast('登録エラー: ' + (e.message || e)); }
      finally { setBusy(false); }
    };

    if (!open) return null;

    return (
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, zIndex: 100,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        background: 'rgba(0,0,0,0.35)',
      }}>
        <div onClick={e => e.stopPropagation()} style={{
          width: '100%', maxWidth: 480, background: '#fafaf7',
          borderTopLeftRadius: 24, borderTopRightRadius: 24,
          padding: '14px 18px 28px',
          maxHeight: '90vh', overflowY: 'auto',
          animation: 'slideUp 240ms cubic-bezier(0.2, 0.8, 0.2, 1)',
        }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(0,0,0,0.15)', margin: '0 auto 12px' }}></div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: '#1a1a1a' }}>予定を話す 🍀</div>
            <button onClick={onClose} style={{ all: 'unset', cursor: 'pointer', color: '#888', fontSize: 14 }}>閉じる</button>
          </div>
          <div style={{ fontSize: 11.5, color: '#888', marginBottom: 14 }}>
            例：「4月15日 プレゼン準備」「歯医者 4月3日 14時」
          </div>
          <textarea value={transcript} onChange={e => setTranscript(e.target.value)}
            placeholder={listening ? '聞いています…' : 'マイクをタップして話す または ここに直接入力'}
            rows={3}
            style={{
              width: '100%', boxSizing: 'border-box',
              padding: '12px 14px', borderRadius: 12,
              border: '0.5px solid rgba(0,0,0,0.06)',
              background: '#fff', fontSize: 15, color: '#1a1a1a',
              fontFamily: 'inherit', resize: 'vertical', outline: 'none',
              marginBottom: 12,
            }}
          />
          {parsed && (
            <div style={{
              background: '#fff', borderRadius: 12, padding: '12px 14px',
              border: `1px solid ${ACCENT}55`, marginBottom: 12,
            }}>
              <div style={{ fontSize: 14.5, fontWeight: 500, color: '#1a1a1a' }}>{parsed.title}</div>
              <div style={{ fontSize: 11.5, color: '#888', marginTop: 4, fontVariantNumeric: 'tabular-nums' }}>
                {parsed.start_date}{parsed.end_date && parsed.end_date !== parsed.start_date ? ` 〜 ${parsed.end_date}` : ''}
                {parsed.start_time ? ` ${parsed.start_time}` : ''}
                {parsed.end_time ? ` 〜 ${parsed.end_time}` : ''}
              </div>
              {parsed.memo && <div style={{ fontSize: 12, color: '#666', marginTop: 6 }}>{parsed.memo}</div>}
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: '6px 0 4px' }}>
            <button onClick={listening ? stop : start} disabled={busy} style={{
              all: 'unset', cursor: busy ? 'wait' : 'pointer',
              width: 68, height: 68, borderRadius: 999,
              background: listening ? '#c0392b' : '#1a1a1a',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: listening ? `0 0 0 8px ${ACCENT}33` : '0 6px 18px rgba(0,0,0,0.18)',
              animation: listening ? 'pulse 1.2s ease-in-out infinite' : 'none',
              opacity: busy ? 0.5 : 1,
            }}>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <rect x="9" y="3" width="6" height="12" rx="3" fill="#fff"/>
                <path d="M5 11a7 7 0 0014 0M12 18v3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
              </svg>
            </button>

  function NoteVoiceModal({ open, onClose, note, onApplied }) {
    const [listening, setListening] = useState(false);
    const [transcript, setTranscript] = useState('');
    const [busy, setBusy] = useState(false);
    const [preview, setPreview] = useState(null);
    const recogRef = useRef(null);
    const supported = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);

    useEffect(() => {
      if (!open) {
        setListening(false); setTranscript(''); setPreview(null); setBusy(false);
        if (recogRef.current) try { recogRef.current.stop(); } catch (e) {}
      }
    }, [open]);

    const start = () => {
      if (!supported) { showToast('音声認識非対応'); return; }
      setTranscript(''); setPreview(null);
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const r = new Rec();
      r.lang = 'ja-JP'; r.interimResults = true; r.continuous = true;
      let finalText = '';
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        setTranscript((finalText + interim).trim());
      };
      r.onerror = () => setListening(false);
      r.onend = () => setListening(false);
      recogRef.current = r;
      r.start();
      setListening(true);
    };
    const stop = () => {
      if (recogRef.current) try { recogRef.current.stop(); } catch (e) {}
      setListening(false);
    };

    const runAI = async () => {
      if (!note) return;
      const text = transcript.trim();
      if (!text) { showToast('テキストを入力してください'); return; }
      setBusy(true);
      try {
        const res = await rpc('processNoteAIData', text, note.note_id, note.tab_name);
        if (res && res.success) setPreview(res);
        else showToast(res && res.error ? res.error : 'AI整理に失敗');
      } catch (e) { showToast('AIエラー: ' + (e.message || e)); }
      finally { setBusy(false); }
    };

    const apply = async (mode) => {
      if (!note || !preview) return;
      setBusy(true);
      try {
        const newText = mode === 'replace'
          ? preview.structuredText
          : (note.note_text ? note.note_text + '\n\n' + preview.structuredText : preview.structuredText);
        await rpc('saveNoteData', note.note_id, newText);
        const updated = { note_text: newText };
        if (preview.autoTitle && preview.title) {
          await rpc('saveNoteNameData', note.note_id, preview.title);
          updated.tab_name = preview.title;
        }
        onApplied && onApplied(updated);
        showToast(mode === 'replace' ? '上書きしました' : '追記しました');
        onClose();
      } catch (e) { showToast('保存失敗: ' + (e.message || e)); }
      finally { setBusy(false); }
    };

    if (!open) return null;
    return (
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, zIndex: 100,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        background: 'rgba(0,0,0,0.35)',
      }}>
        <div onClick={e => e.stopPropagation()} style={{
          width: '100%', maxWidth: 480, background: '#fafaf7',
          borderTopLeftRadius: 24, borderTopRightRadius: 24,
          padding: '14px 18px 28px',
          maxHeight: '90vh', overflowY: 'auto',
          animation: 'slideUp 240ms cubic-bezier(0.2, 0.8, 0.2, 1)',
        }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(0,0,0,0.15)', margin: '0 auto 12px' }}></div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: '#1a1a1a' }}>音声で整理 ✨</div>
            <button onClick={onClose} style={{ all: 'unset', cursor: 'pointer', color: '#888', fontSize: 14 }}>閉じる</button>
          </div>
          <div style={{ fontSize: 11.5, color: '#888', marginBottom: 14 }}>
            話した内容をAIが校正・構造化・分類します。
          </div>
          <textarea value={transcript} onChange={e => setTranscript(e.target.value)}
            placeholder={listening ? '聞いています…' : 'マイクをタップして話す または ここに直接入力'}
            rows={3}
            style={{
              width: '100%', boxSizing: 'border-box',
              padding: '12px 14px', borderRadius: 12,
              border: '0.5px solid rgba(0,0,0,0.06)',
              background: '#fff', fontSize: 15, color: '#1a1a1a',
              fontFamily: 'inherit', resize: 'vertical', outline: 'none',
              marginBottom: 12,
            }}
          />
          {preview && (
            <div style={{
              background: '#fff', borderRadius: 12, padding: '12px 14px',
              border: `1px solid ${ACCENT}55`, marginBottom: 12,
            }}>
              {preview.title && <div style={{ fontSize: 11.5, color: ACCENT, fontWeight: 600, marginBottom: 6 }}>提案タイトル：{preview.title}</div>}
              <div style={{ fontSize: 13.5, color: '#1a1a1a', whiteSpace: 'pre-wrap', lineHeight: 1.6 }}>{preview.structuredText}</div>
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: '6px 0 4px' }}>
            <button onClick={listening ? stop : start} disabled={busy} style={{
              all: 'unset', cursor: busy ? 'wait' : 'pointer',
              width: 68, height: 68, borderRadius: 999,
              background: listening ? '#c0392b' : '#1a1a1a',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: listening ? `0 0 0 8px ${ACCENT}33` : '0 6px 18px rgba(0,0,0,0.18)',
              animation: listening ? 'pulse 1.2s ease-in-out infinite' : 'none',
              opacity: busy ? 0.5 : 1,
            }}>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <rect x="9" y="3" width="6" height="12" rx="3" fill="#fff"/>
                <path d="M5 11a7 7 0 0014 0M12 18v3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
              </svg>
            </button>
            <button onClick={runAI} disabled={busy || !transcript.trim()} style={{
              all: 'unset', cursor: busy ? 'wait' : 'pointer',
              padding: '10px 18px', borderRadius: 999,
              background: 'rgba(0,0,0,0.06)', color: '#1a1a1a',
              fontSize: 13, fontWeight: 600,
              opacity: (busy || !transcript.trim()) ? 0.4 : 1,
            }}>{busy ? 'AI処理中…' : 'AIで整理'}</button>
          </div>
          {preview && (
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <button onClick={() => apply('append')} disabled={busy} style={{
                all: 'unset', cursor: busy ? 'wait' : 'pointer', flex: 1,
                padding: '12px 0', borderRadius: 10, textAlign: 'center',
                background: 'rgba(0,0,0,0.06)', color: '#1a1a1a',
                fontSize: 13, fontWeight: 600,
              }}>末尾に追記</button>
              <button onClick={() => apply('replace')} disabled={busy} style={{
                all: 'unset', cursor: busy ? 'wait' : 'pointer', flex: 1,
                padding: '12px 0', borderRadius: 10, textAlign: 'center',
                background: '#1a1a1a', color: '#fff',
                fontSize: 13, fontWeight: 600,
              }}>上書き</button>
            </div>
          )}
        </div>
      </div>
    );
  }

        if (res && res.success) setNotes(res.notes || []);
        else showToast(res && res.error ? res.error : 'ノート読み込み失敗');
        setLoading(false);
      }).catch(err => {
        showToast('ノート読み込みエラー: ' + (err.message || err));
        setLoading(false);
      });
    }, []);

    const active = notes.find(n => n.note_id === activeId);

      setNotes(ns => ns.map(n => n.note_id === noteId ? { ...n, ...patch } : n));

      if (!active) return;
      updateNoteLocal(active.note_id, { note_text: text });

      saveTimerRef.current = setTimeout(() => {
        if (text === lastSentRef.current) return;
        lastSentRef.current = text;
        rpc('saveNoteData', active.note_id, text)
          .then(res => {
            if (res && res.success) showSync('success', '保存しました');
            else showSync('error', '保存失敗');

          .catch(() => showSync('error', '保存失敗'));

      setTempName(active.tab_name);
      setEditingName(true);

      if (!active) return;
      const newName = tempName.trim() || active.tab_name;

      updateNoteLocal(active.note_id, { tab_name: newName });

        </button>

        <NoteVoiceModal
          open={voiceOpen} onClose={() => setVoiceOpen(false)}
          note={active}
          onApplied={(updated) => {
            updateNoteLocal(active.note_id, updated);
          }}
        />
      </div>
    );
  }

  function ViewSwitch({ value, onChange }) {
    const opts = [
      { id: 'calendar', label: 'カレンダー' },
      { id: 'notes', label: 'メモ' },
    ];
    return (
      <div style={{
        margin: '0 14px 8px',
        display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0,
        background: '#f1efe9', borderRadius: 10, padding: 3,
      }}>
        {opts.map(o => {
          const active = o.id === value;
          return (
            <button key={o.id} onClick={() => onChange(o.id)} style={{
              all: 'unset', cursor: 'pointer', textAlign: 'center',
              padding: '7px 0', fontSize: 13, fontWeight: 600,
              color: active ? '#1a1a1a' : '#888',
              background: active ? '#fff' : 'transparent',
              borderRadius: 8,
              boxShadow: active ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
              transition: 'all 160ms ease',
            }}>{o.label}</button>
          );
        })}
      </div>
    );
  }

  function App() {
    const [today, setToday] = useState(todayKey());
    const [year, setYear] = useState(new Date().getFullYear());
    const [month, setMonth] = useState(new Date().getMonth() + 1);
    const [selectedDate, setSelectedDate] = useState(todayKey());
    const [calendarData, setCalendarData] = useState({ events: {}, holidays: {}, rokuyo: {} });
    const [view, setView] = useState('calendar');
    const [voiceOpen, setVoiceOpen] = useState(false);
    const [eventModal, setEventModal] = useState(null);
    const [calLoading, setCalLoading] = useState(false);

    const splashHide = () => {
      const el = document.getElementById('splash');
      if (el) el.classList.add('hide');
      setTimeout(() => { if (el) el.style.display = 'none'; }, 320);
    };

    const loadCalendar = useCallback(async (y, m) => {
      setCalLoading(true);
      try {
        const res = await rpc('getCalendarData', y, m);
        // getCalendarDataはsuccess無し・常にevents/holidays/rokuyoを返す仕様
        if (res && (res.events !== undefined || res.holidays !== undefined)) {
          setCalendarData({
            events: sortEventsMap(res.events || {}),
            holidays: res.holidays || {},
            rokuyo: res.rokuyo || {},
          });
        } else if (res && res.error) {
          showToast(res.error);
        } else {
          showToast('カレンダー取得失敗');
        }
      } catch (e) {
        showToast('読込エラー: ' + (e.message || e));
      } finally { setCalLoading(false); }
    }, []);

    useEffect(() => {
      rpc('getInitialData').then(res => {
        // getInitialDataはsuccess無し・{today, year, month, day}を返す仕様
        if (res && res.today) {
          const t = res.today;
          const y = res.year || new Date().getFullYear();
          const m = res.month || new Date().getMonth() + 1;
          setToday(t); setYear(y); setMonth(m); setSelectedDate(t);
          return loadCalendar(y, m);
        } else {
          return loadCalendar(year, month);
        }
      }).catch(err => {
        showToast('初期化エラー: ' + (err.message || err));
      }).finally(() => {
        splashHide();
      });
    }, []);

    const goPrev = () => {
      let y = year, m = month - 1;
      if (m < 1) { m = 12; y -= 1; }
      setYear(y); setMonth(m);
      loadCalendar(y, m);
    };
    const goNext = () => {
      let y = year, m = month + 1;
      if (m > 12) { m = 1; y += 1; }
      setYear(y); setMonth(m);
      loadCalendar(y, m);
    };

    const monthEventCount = useMemo(() => {
      let count = 0;
      const prefix = `${year}-${pad2(month)}`;
      for (const k in calendarData.events) {
        if (k.startsWith(prefix)) count += (calendarData.events[k] || []).length;
      }
      return count;
    }, [calendarData.events, year, month]);

    const dayEvents = calendarData.events[selectedDate] || [];
    const refreshAfterChange = () => loadCalendar(year, month);

    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#fafaf7' }}>
        <div style={{
          background: '#fafaf7',
          borderBottom: '0.5px solid rgba(0,0,0,0.06)',
          paddingTop: 18,
        }}>
          <div style={{ padding: '4px 18px 8px', display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 10.5, color: '#888', letterSpacing: 1.6, fontWeight: 600 }}>🍀 {APP_NAME.toUpperCase()}</div>
              <div style={{ fontSize: 21, fontWeight: 400, color: '#1a1a1a', marginTop: 1, letterSpacing: -0.4 }}>
                {view === 'calendar' ? jpMonthLabel(year, month) : 'メモ'}
              </div>
            </div>
            {view === 'calendar' && (
              <div style={{ fontSize: 10.5, color: '#aaa', fontVariantNumeric: 'tabular-nums' }}>
                {calLoading ? '読込中…' : `${monthEventCount}件の予定`}
              </div>
            )}
          </div>
          <ViewSwitch value={view} onChange={setView} />
        </div>

        <div style={{ flex: 1, position: 'relative' }}>
          {view === 'calendar' ? (
            <React.Fragment>
              <CalendarScreen
                year={year} month={month}
                evMap={calendarData.events}
                holidays={calendarData.holidays}
                rokuyo={calendarData.rokuyo}
                onPrev={goPrev} onNext={goNext}
                onSelectDate={setSelectedDate}
                selectedDate={selectedDate}
                todayK={today}
              />
              <DayDetailPanel
                dateKey={selectedDate}
                events={dayEvents}
                holidays={calendarData.holidays}
                onEditEvent={(id) => setEventModal({ mode: 'edit', eventId: id })}
                onCreateEvent={(d) => setEventModal({ mode: 'create', defaultDate: d })}
              />
            </React.Fragment>
          ) : (
            <NotesView />
          )}
          <div style={{ height: 60 }} />
        </div>

        {view === 'calendar' && (
          <button onClick={() => setVoiceOpen(true)} aria-label="予定を音声で追加" style={{
            all: 'unset', cursor: 'pointer',
            position: 'fixed', right: 18, bottom: 44, zIndex: 50,
            width: 56, height: 56, borderRadius: 999,
            background: '#1a1a1a',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 8px 24px rgba(0,0,0,0.22), 0 2px 4px rgba(0,0,0,0.12)',
          }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="6" height="12" rx="3" fill="#fff"/>
              <path d="M5 11a7 7 0 0014 0M12 18v3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
            </svg>
          </button>
        )}

        <CalendarVoiceModal
          open={voiceOpen} onClose={() => setVoiceOpen(false)}
          defaultDate={selectedDate}
          onAdded={refreshAfterChange}
        />
        {eventModal && (
          <EventFormModal
            mode={eventModal.mode}
            eventId={eventModal.eventId}
            defaultDate={eventModal.defaultDate || selectedDate}
            onClose={() => setEventModal(null)}
            onSaved={refreshAfterChange}
          />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
